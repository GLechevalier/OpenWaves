name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install openwaves
        run: pip install -e software/pyopenwaves[dev]
      - name: Run tests
        run: pytest software/pyopenwaves/tests -q

  build-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          pip install build twine
          python -m build software/pyopenwaves
      - name: Check
        run: twine check software/pyopenwaves/dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: openwaves-wheel
          path: software/pyopenwaves/dist/*.whl
